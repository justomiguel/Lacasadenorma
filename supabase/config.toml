# Configuración de Supabase para este proyecto.
#
# El desarrollo local de este repositorio **no usa `supabase start`**: no hay
# Docker en el entorno de trabajo, y montar una plataforma completa para verificar
# migraciones es desproporcionado (ADR-013). Se usa un Postgres de `apt` más el
# shim de `supabase/shim/`, y los comandos del CLI que aceptan `--db-url`.
#
# Este archivo existe igual porque el CLI lo necesita para resolver el proyecto y
# para `supabase db push --linked` en CI.

project_id = "la-casa-de-norma"

[db]
# Misma versión mayor que los proyectos nuevos de Supabase. El Postgres local de
# `scripts/db-local.sh` se instala en esta misma versión desde el repositorio
# oficial de PostgreSQL, para que una migración que pasa local no falle en
# producción por una diferencia de versión (ADR-013).
major_version = 17

[db.migrations]
# Las migraciones se aplican en orden de nombre de archivo, que lleva timestamp.
schema_paths = []

[auth]
# Abierto al público desde ADR-027. **Habilita el registro para todo el proyecto**,
# incluido el endpoint de Auth: no hay forma de abrirlo "sólo para donantes". Lo que
# frena las cuentas basura es la confirmación de correo y el límite de tasa de abajo,
# no una lista de invitación.
#
# La condición para que esto sea seguro no está en este archivo: está en que ninguna
# policy le dé nada a `authenticated` sin comprobar rol o propiedad. Lo verifica
# `npm run check:rls` en cada commit y la persona `donante` de la matriz de pgTAP.
enable_signup = true

# Los callbacks de OAuth (ADR-039) y los enlaces del correo tienen que estar en
# `additional_redirect_urls` del proyecto hospedado, incluidas las preview de
# Vercel. Acá no se listan: este archivo no es el que atiende Auth en local
# (`scripts/local-api` emula el canje). El procedimiento está en docs/runbook.md.

[auth.email]
enable_signup = true

# **No es cosmético.** Es lo que hace que tener sesión implique correo confirmado, y
# de eso depende que `claim_donation_item()` no tenga que verificar el correo por su
# cuenta. El campo que parecería servir para eso vive en `user_metadata`, que la
# propia persona puede escribir con una llamada a `updateUser` (amenaza S3).
enable_confirmations = true

# Entre dos correos al mismo destinatario. El default de GoTrue es un minuto y sirve;
# se escribe explícito porque es la defensa contra usar el formulario de recuperación
# para inundar una casilla ajena.
max_frequency = "1m"

# El relay SMTP de Resend, para los tres correos de identidad —confirmación,
# recuperación y cambio de correo—, que los emite GoTrue y no la aplicación
# (ADR-028). Sin esto, esos correos saldrían por el remitente compartido de Supabase,
# que está pensado para desarrollo y limita a unos pocos por hora: el registro
# funcionaría los primeros minutos y después no, sin que nada lo explique.
#
# `pass` es la **misma** clave que usa el adaptador de los correos del producto, así
# que rotarla es rotarla en dos lugares. Está escrito en `docs/runbook.md` porque es
# la clase de cosa que se descubre cuando los correos dejan de salir.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 587
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "env(EMAIL_FROM_ADDRESS)"
sender_name = "La Casa de Norma"

[auth.rate_limit]
# El default de GoTrue son 2 correos por hora **para todo el proyecto**, que se agota
# con dos registros y deja al tercero sin poder confirmar su cuenta sin que nada lo
# explique. Con el registro abierto eso pasa de improbable a garantizado.
email_sent = 30
sign_in_sign_ups = 30
token_verifications = 30

[auth.hook.custom_access_token]
# El rol viaja en el token como claim de `app_metadata`, que sólo el servidor de
# auth puede escribir. Leerlo de `user_metadata` sería una escalada de privilegios
# trivial (amenaza S3).
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[storage]
enabled = true

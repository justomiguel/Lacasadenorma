name: E2E

# Los nueve flujos críticos y la revisión de accesibilidad con axe, en los tres
# proyectos de Playwright: chromium, webkit e iPhone 15.
#
# Corre aparte de `ci.yml` porque descarga navegadores y levanta el sitio: es lo
# más lento del repositorio y no tiene sentido que retrase el typecheck.
#
# IMPORTANTE: esta suite corre SIN credenciales de Supabase, y eso es a propósito.
# El sitio tiene que funcionar sin base de datos configurada: muestra el contenido
# editorial, omite las cifras y avisa (FR-034, SC-012). Correr los E2E en ese modo
# es la única verificación automática de que esa degradación funciona. Si algún
# test falla por falta de datos, lo que hay que arreglar es el test o la página,
# NO agregar secretos a este workflow.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flujos:
    name: Flujos críticos y accesibilidad en tres navegadores
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Traer el código del pull request
        uses: actions/checkout@v7

      - name: Preparar Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar las dependencias fijadas en el lockfile
        run: npm ci

      # Los navegadores se cachean por versión de Playwright, no por lockfile
      # entero: cambiar cualquier otra dependencia no cambia qué navegadores hacen
      # falta, y volver a bajar tres navegadores por eso serían minutos tirados.
      - name: Averiguar qué versión de navegadores corresponde
        id: playwright
        run: |
          version="$(node --print "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Reusar los navegadores ya descargados
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # Con el caché caliente esto sólo instala las bibliotecas del sistema que
      # webkit necesita, que no se cachean porque viven fuera del home.
      - name: Instalar los navegadores y sus dependencias del sistema
        run: npx playwright install --with-deps

      # `playwright.config.ts` levanta `npm run start` cuando detecta CI, o sea el
      # servidor de producción: sin build previo no hay nada que servir.
      - name: Construir el sitio como se construye en producción
        run: npm run build

      - name: Recorrer los nueve flujos críticos
        run: npm run test:e2e

      # Sólo cuando algo falla: en verde el reporte no lo mira nadie y ocupa lugar.
      # Las trazas de Playwright pueden contener capturas del sitio, así que se
      # retienen poco tiempo.
      - name: Guardar el reporte y las trazas de lo que falló
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
